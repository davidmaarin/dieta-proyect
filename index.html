<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de Dieta</title>
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #f5f7f5; --card: #ffffff; --text: #1a1f1c; --muted: #6b7570;
    --border: #dfe5e1; --accent: #16a34a; --accent-soft: #e7f6ec; --danger: #dc2626;
    --p: #2563eb; --c: #d97706; --f: #db2777; --k: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1311; --card: #181d1a; --text: #e8ece9; --muted: #9aa49f;
      --border: #2a322d; --accent: #22c55e; --accent-soft: #15291d; --danger: #f87171;
      --p: #60a5fa; --c: #fbbf24; --f: #f472b6; --k: #22c55e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--card);
    border-bottom: 1px solid var(--border); padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  header h1 { margin: 0; font-size: 18px; }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
    background: var(--card); border-top: 1px solid var(--border);
    display: flex; padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; border: 0; background: none; color: var(--muted); padding: 10px 4px;
    font-size: 13px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  nav button span { font-size: 20px; }
  nav button.active { color: var(--accent); font-weight: 600; }
  @media (min-width: 820px) {
    body { padding-bottom: 0; }
    nav { position: sticky; top: 53px; bottom: auto; border-top: 0; border-bottom: 1px solid var(--border); justify-content: center; }
    nav button { flex: 0 0 160px; flex-direction: row; justify-content: center; gap: 6px; font-size: 15px; }
    nav button span { font-size: 16px; }
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin-bottom: 14px;
  }
  .card h2 { margin: 0 0 10px; font-size: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); flex: 1; min-width: 70px; }
  label.wide { flex: 3; min-width: 160px; }
  input, select {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.btn {
    font: inherit; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 600; white-space: nowrap;
  }
  button.btn.ghost { background: var(--accent-soft); color: var(--accent); }
  button.btn.small { padding: 6px 10px; font-size: 13px; }
  button.icon {
    border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px;
    padding: 4px 8px; border-radius: 6px; line-height: 1;
  }
  button.icon:hover { background: var(--bg); color: var(--danger); }
  button.icon.edit:hover { color: var(--accent); }
  .list { display: flex; flex-direction: column; }
  .item {
    display: flex; align-items: center; gap: 8px; padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }
  .item:last-child { border-bottom: 0; }
  .item .name { flex: 1; min-width: 0; }
  .item .name b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item input.g { width: 78px; text-align: right; padding: 6px 8px; }
  .macros { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .k { color: var(--k); } .p { color: var(--p); } .c { color: var(--c); } .f { color: var(--f); }
  .totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tot { background: var(--bg); border-radius: 10px; padding: 8px; text-align: center; }
  .tot .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tot .l { font-size: 11px; color: var(--muted); }
  .tot .t { font-size: 11px; color: var(--muted); }
  .bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .meal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .meal-head input { font-weight: 600; font-size: 16px; border-color: transparent; background: transparent; padding: 4px 6px; }
  .meal-head input:focus { border-color: var(--border); background: var(--bg); }
  .meal-sum { font-size: 12px; margin: 8px 0; display: flex; gap: 10px; flex-wrap: wrap; font-weight: 600; }
  .add-row { display: flex; gap: 6px; margin-top: 8px; }
  .add-row select { flex: 1; }
  .add-row input { width: 80px; flex: none; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .search { margin-bottom: 8px; }
  .hidden { display: none !important; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper b { min-width: 24px; text-align: center; font-size: 18px; }
  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>🥗 Dieta</h1>
  <div class="row">
    <button class="btn ghost small" id="btnExport" title="Guardar copia en un archivo">⬇ Exportar</button>
    <button class="btn ghost small" id="btnImport" title="Cargar copia desde un archivo">⬆ Importar</button>
    <input type="file" id="fileImport" accept="application/json,.json" class="hidden">
  </div>
</header>

<nav>
  <button data-tab="foods" class="active"><span>🍎</span>Alimentos</button>
  <button data-tab="calc"><span>🧮</span>Calculadora</button>
  <button data-tab="plan"><span>📅</span>Planificador</button>
</nav>

<main>
  <!-- ALIMENTOS -->
  <section id="tab-foods">
    <div class="card">
      <h2 id="foodFormTitle">Añadir alimento <span class="muted">(valores por 100 g)</span></h2>
      <form id="foodForm" class="row" autocomplete="off">
        <label class="wide">Nombre<input id="fName" required placeholder="Ej: Arroz blanco"></label>
        <label><span class="p">Proteína g</span><input id="fP" type="number" step="any" min="0" inputmode="decimal" required></label>
        <label><span class="c">Carbos g</span><input id="fC" type="number" step="any" min="0" inputmode="decimal" required></label>
        <label><span class="f">Grasa g</span><input id="fF" type="number" step="any" min="0" inputmode="decimal" required></label>
        <label><span class="k">Kcal</span><input id="fK" type="number" step="any" min="0" inputmode="decimal" placeholder="auto"></label>
        <button class="btn" type="submit" id="foodSubmit">Añadir</button>
        <button class="btn ghost hidden" type="button" id="foodCancel">Cancelar</button>
      </form>
      <p class="muted" style="margin:8px 0 0">Si dejas las kcal vacías se calculan solas (4·P + 4·C + 9·G).</p>
    </div>
    <div class="card">
      <h2>Mis alimentos <span class="muted" id="foodCount"></span></h2>
      <input class="search" id="foodSearch" placeholder="🔍 Buscar...">
      <div class="list" id="foodList"></div>
    </div>
  </section>

  <!-- CALCULADORA -->
  <section id="tab-calc" class="hidden">
    <div class="card">
      <h2>Calculadora rápida</h2>
      <div class="add-row">
        <select id="calcFood"></select>
        <input id="calcG" type="number" min="0" step="any" inputmode="decimal" placeholder="g" value="100">
        <button class="btn" id="calcAdd">+</button>
      </div>
    </div>
    <div class="card">
      <div class="list" id="calcList"></div>
    </div>
    <div class="card">
      <h2>Total</h2>
      <div class="totals" id="calcTotals"></div>
      <div style="margin-top:10px"><button class="btn ghost small" id="calcClear">Vaciar calculadora</button></div>
    </div>
  </section>

  <!-- PLANIFICADOR -->
  <section id="tab-plan" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2 style="margin:0">Número de comidas</h2>
        <div class="stepper">
          <button class="btn ghost small" id="mealsMinus">−</button>
          <b id="mealsCount">0</b>
          <button class="btn ghost small" id="mealsPlus">+</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>Total del día</h2>
      <div class="totals" id="planTotals"></div>
      <details style="margin-top:10px">
        <summary class="muted" style="cursor:pointer">🎯 Objetivos diarios (opcional)</summary>
        <div class="row" style="margin-top:8px">
          <label><span class="k">Kcal</span><input type="number" min="0" inputmode="decimal" data-target="k"></label>
          <label><span class="p">Proteína g</span><input type="number" min="0" inputmode="decimal" data-target="p"></label>
          <label><span class="c">Carbos g</span><input type="number" min="0" inputmode="decimal" data-target="c"></label>
          <label><span class="f">Grasa g</span><input type="number" min="0" inputmode="decimal" data-target="f"></label>
        </div>
      </details>
    </div>
    <div id="meals"></div>
    <div class="card"><button class="btn ghost small" id="planClear">Vaciar todas las comidas</button></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const KEY = 'dieta-app-v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const r1 = n => Math.round(n * 10) / 10;
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n >= 0 ? n : 0; };

const DEFAULT_FOODS = [
  ['Arroz blanco (crudo)', 7, 79, 0.6, 356],
  ['Pechuga de pollo', 23, 0, 1.5, 110],
  ['Huevo entero', 12.5, 0.7, 10, 143],
  ['Avena', 13, 60, 7, 372],
  ['Plátano', 1.1, 20, 0.3, 89],
  ['Aceite de oliva', 0, 0, 100, 884],
  ['Leche semidesnatada', 3.2, 4.7, 1.6, 46],
  ['Pasta (cruda)', 12, 71, 1.5, 355],
  ['Atún al natural', 26, 0, 1, 112],
  ['Patata', 2, 17, 0.1, 77],
];

let state = load();

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.foods)) return normalize(s);
  } catch (e) {}
  return normalize({
    foods: DEFAULT_FOODS.map(([name, p, c, f, k]) => ({ id: uid(), name, p, c, f, k })),
  });
}
function normalize(s) {
  return {
    foods: s.foods || [],
    calc: s.calc || [],
    meals: s.meals && s.meals.length ? s.meals : ['Desayuno', 'Comida', 'Merienda', 'Cena'].map(n => ({ id: uid(), name: n, items: [] })),
    targets: s.targets || {},
  };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast('No se pudo guardar'); }
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

const foodById = id => state.foods.find(f => f.id === id);
function macrosFor(foodId, g) {
  const f = foodById(foodId);
  if (!f) return { k: 0, p: 0, c: 0, f: 0 };
  const m = g / 100;
  return { k: f.k * m, p: f.p * m, c: f.c * m, f: f.f * m };
}
function sum(items) {
  return items.reduce((a, it) => {
    const m = macrosFor(it.foodId, it.g);
    a.k += m.k; a.p += m.p; a.c += m.c; a.f += m.f; return a;
  }, { k: 0, p: 0, c: 0, f: 0 });
}
const macroLine = m => `<span class="k">${Math.round(m.k)} kcal</span><span class="p">P ${r1(m.p)}</span><span class="c">C ${r1(m.c)}</span><span class="f">G ${r1(m.f)}</span>`;

function totalsHTML(t, targets = {}) {
  const defs = [['k', 'Kcal', 0], ['p', 'Proteína', 1], ['c', 'Carbos', 1], ['f', 'Grasa', 1]];
  return defs.map(([key, label, dec]) => {
    const v = dec ? r1(t[key]) : Math.round(t[key]);
    const target = num(targets[key]);
    const extra = target ? `<div class="t">/ ${target}${key === 'k' ? '' : ' g'}</div>
      <div class="bar"><i style="width:${Math.min(100, t[key] / target * 100)}%;background:var(--${key})"></i></div>` : '';
    return `<div class="tot"><div class="v ${key}">${v}</div><div class="l">${label}${key === 'k' ? '' : ' (g)'}</div>${extra}</div>`;
  }).join('');
}

function foodOptions() {
  if (!state.foods.length) return '<option value="">— Primero añade alimentos —</option>';
  return [...state.foods].sort((a, b) => a.name.localeCompare(b.name, 'es'))
    .map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('');
}

function itemRowHTML(it, ctx) {
  const f = foodById(it.foodId);
  const m = macrosFor(it.foodId, it.g);
  return `<div class="item" data-ctx="${ctx}" data-id="${it.id}">
    <div class="name"><b>${f ? esc(f.name) : '<i>(alimento borrado)</i>'}</b><div class="macros">${macroLine(m)}</div></div>
    <input class="g" type="number" min="0" step="any" inputmode="decimal" value="${it.g}" aria-label="gramos"> <span class="muted">g</span>
    <button class="icon" data-del title="Quitar">✕</button>
  </div>`;
}

/* ---------- ALIMENTOS ---------- */
let editingId = null;
function renderFoods() {
  const q = $('#foodSearch').value.trim().toLowerCase();
  const foods = [...state.foods].sort((a, b) => a.name.localeCompare(b.name, 'es'))
    .filter(f => !q || f.name.toLowerCase().includes(q));
  $('#foodCount').textContent = `(${state.foods.length})`;
  $('#foodList').innerHTML = foods.length ? foods.map(f => `
    <div class="item" data-id="${f.id}">
      <div class="name"><b>${esc(f.name)}</b><div class="macros">${macroLine(f)} <span>/100 g</span></div></div>
      <button class="icon edit" data-edit title="Editar">✎</button>
      <button class="icon" data-delfood title="Borrar">🗑</button>
    </div>`).join('') : '<div class="empty">No hay alimentos.</div>';
}
$('#foodSearch').addEventListener('input', renderFoods);

$('#foodForm').addEventListener('submit', e => {
  e.preventDefault();
  const p = num($('#fP').value), c = num($('#fC').value), f = num($('#fF').value);
  const kRaw = $('#fK').value.trim();
  const k = kRaw === '' ? Math.round(4 * p + 4 * c + 9 * f) : num(kRaw);
  const name = $('#fName').value.trim();
  if (!name) return;
  if (editingId) {
    Object.assign(foodById(editingId), { name, p, c, f, k });
    toast('Alimento actualizado');
  } else {
    state.foods.push({ id: uid(), name, p, c, f, k });
    toast('Alimento añadido');
  }
  resetFoodForm(); save(); renderAll();
});
function resetFoodForm() {
  editingId = null;
  $('#foodForm').reset();
  $('#foodSubmit').textContent = 'Añadir';
  $('#foodFormTitle').firstChild.textContent = 'Añadir alimento ';
  $('#foodCancel').classList.add('hidden');
}
$('#foodCancel').addEventListener('click', resetFoodForm);

$('#foodList').addEventListener('click', e => {
  const row = e.target.closest('.item'); if (!row) return;
  const f = foodById(row.dataset.id);
  if (e.target.closest('[data-edit]')) {
    editingId = f.id;
    $('#fName').value = f.name; $('#fP').value = f.p; $('#fC').value = f.c; $('#fF').value = f.f; $('#fK').value = f.k;
    $('#foodSubmit').textContent = 'Guardar';
    $('#foodFormTitle').firstChild.textContent = 'Editar alimento ';
    $('#foodCancel').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    $('#fName').focus();
  } else if (e.target.closest('[data-delfood]')) {
    const used = state.calc.some(i => i.foodId === f.id) || state.meals.some(m => m.items.some(i => i.foodId === f.id));
    if (!confirm(`¿Borrar "${f.name}"?${used ? '\nTambién se quitará de la calculadora y del planificador.' : ''}`)) return;
    state.foods = state.foods.filter(x => x.id !== f.id);
    state.calc = state.calc.filter(i => i.foodId !== f.id);
    state.meals.forEach(m => m.items = m.items.filter(i => i.foodId !== f.id));
    save(); renderAll();
  }
});

/* ---------- CALCULADORA ---------- */
function renderCalc() {
  const sel = $('#calcFood'), prev = sel.value;
  sel.innerHTML = foodOptions();
  if (prev && foodById(prev)) sel.value = prev;
  $('#calcList').innerHTML = state.calc.length
    ? state.calc.map(it => itemRowHTML(it, 'calc')).join('')
    : '<div class="empty">Añade alimentos arriba y ajusta los gramos.</div>';
  renderCalcTotals();
}
function renderCalcTotals() { $('#calcTotals').innerHTML = totalsHTML(sum(state.calc)); }
$('#calcAdd').addEventListener('click', () => {
  const foodId = $('#calcFood').value; if (!foodId) return;
  state.calc.push({ id: uid(), foodId, g: num($('#calcG').value) || 100 });
  save(); renderCalc();
});
$('#calcClear').addEventListener('click', () => {
  if (state.calc.length && confirm('¿Vaciar la calculadora?')) { state.calc = []; save(); renderCalc(); }
});

/* ---------- PLANIFICADOR ---------- */
function renderPlan() {
  $('#mealsCount').textContent = state.meals.length;
  $('#meals').innerHTML = state.meals.map((m, i) => `
    <div class="card" data-meal="${m.id}">
      <div class="meal-head">
        <input value="${esc(m.name)}" data-mealname aria-label="Nombre de la comida" placeholder="Comida ${i + 1}">
      </div>
      <div class="list">${m.items.length ? m.items.map(it => itemRowHTML(it, 'meal')).join('') : '<div class="empty">Sin alimentos todavía.</div>'}</div>
      <div class="meal-sum" data-mealsum>${macroLine(sum(m.items))}</div>
      <div class="add-row">
        <select data-mealfood>${foodOptions()}</select>
        <input type="number" min="0" step="any" inputmode="decimal" placeholder="g" value="100" data-mealg>
        <button class="btn" data-mealadd>+</button>
      </div>
    </div>`).join('');
  renderPlanTotals();
  document.querySelectorAll('[data-target]').forEach(inp => inp.value = state.targets[inp.dataset.target] ?? '');
}
function renderPlanTotals() {
  $('#planTotals').innerHTML = totalsHTML(sum(state.meals.flatMap(m => m.items)), state.targets);
}
$('#mealsPlus').addEventListener('click', () => {
  state.meals.push({ id: uid(), name: `Comida ${state.meals.length + 1}`, items: [] });
  save(); renderPlan();
});
$('#mealsMinus').addEventListener('click', () => {
  if (state.meals.length <= 1) return;
  const last = state.meals[state.meals.length - 1];
  if (last.items.length && !confirm(`"${last.name}" tiene alimentos. ¿Eliminarla?`)) return;
  state.meals.pop(); save(); renderPlan();
});
$('#planClear').addEventListener('click', () => {
  if (confirm('¿Vaciar los alimentos de todas las comidas?')) { state.meals.forEach(m => m.items = []); save(); renderPlan(); }
});
document.querySelectorAll('[data-target]').forEach(inp => inp.addEventListener('input', () => {
  state.targets[inp.dataset.target] = inp.value; save(); renderPlanTotals();
}));

$('#meals').addEventListener('click', e => {
  const card = e.target.closest('[data-meal]'); if (!card) return;
  const meal = state.meals.find(m => m.id === card.dataset.meal);
  if (e.target.closest('[data-mealadd]')) {
    const foodId = card.querySelector('[data-mealfood]').value; if (!foodId) return;
    meal.items.push({ id: uid(), foodId, g: num(card.querySelector('[data-mealg]').value) || 100 });
    save(); renderPlan();
  }
});
$('#meals').addEventListener('input', e => {
  if (e.target.matches('[data-mealname]')) {
    state.meals.find(m => m.id === e.target.closest('[data-meal]').dataset.meal).name = e.target.value;
    save();
  }
});

/* ---------- Edición de gramos / borrar líneas (calc y comidas) ---------- */
function findItem(row) {
  if (row.dataset.ctx === 'calc') return { list: state.calc, owner: state };
  const meal = state.meals.find(m => m.id === row.closest('[data-meal]').dataset.meal);
  return { list: meal.items, owner: meal };
}
document.addEventListener('input', e => {
  if (!e.target.matches('.item input.g')) return;
  const row = e.target.closest('.item');
  const { list, owner } = findItem(row);
  const it = list.find(i => i.id === row.dataset.id);
  it.g = num(e.target.value);
  row.querySelector('.macros').innerHTML = macroLine(macrosFor(it.foodId, it.g));
  if (row.dataset.ctx === 'calc') renderCalcTotals();
  else { row.closest('[data-meal]').querySelector('[data-mealsum]').innerHTML = macroLine(sum(owner.items)); renderPlanTotals(); }
  save();
});
document.addEventListener('click', e => {
  if (!e.target.closest('.item [data-del]')) return;
  const row = e.target.closest('.item');
  const { owner } = findItem(row);
  if (row.dataset.ctx === 'calc') { state.calc = state.calc.filter(i => i.id !== row.dataset.id); save(); renderCalc(); }
  else { owner.items = owner.items.filter(i => i.id !== row.dataset.id); save(); renderPlan(); }
});

/* ---------- Pestañas ---------- */
function showTab(tab) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  ['foods', 'calc', 'plan'].forEach(t => $('#tab-' + t).classList.toggle('hidden', t !== tab));
  try { localStorage.setItem(KEY + '-tab', tab); } catch (e) {}
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

/* ---------- Exportar / Importar ---------- */
$('#btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `dieta-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('#btnImport').addEventListener('click', () => $('#fileImport').click());
$('#fileImport').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.foods)) throw new Error();
    if (!confirm('Esto reemplazará los datos actuales por los del archivo. ¿Continuar?')) return;
    state = normalize(data); save(); renderAll(); toast('Datos importados');
  } catch (err) { alert('El archivo no es válido.'); }
});

function renderAll() { renderFoods(); renderCalc(); renderPlan(); }
renderAll();
try { showTab(localStorage.getItem(KEY + '-tab') || 'foods'); } catch (e) { showTab('foods'); }

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
